<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bunchy — coming soon</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />

    <!--
      Bunchy — coming soon.

      Served when the site is deliberately held back before launch, which is a
      different situation from a deploy and needs different words. The
      maintenance page says "back in a few minutes" because that is true of a
      restart; saying it for something that is weeks away would be a promise
      that quietly expires.

      Same constraints as maintenance.html: flat file, inline SVG, system type,
      no JavaScript, nothing fetched. It is mounted into Caddy, so it works
      whether or not the app is running at all.
    -->
    <style>
      :root {
        --navy: #0a0e1a;
        --surface: rgba(255, 255, 255, 0.04);
        --line: rgba(255, 255, 255, 0.1);
        --ink: #ffffff;
        --ink-soft: rgba(255, 255, 255, 0.66);
        --ink-faint: rgba(255, 255, 255, 0.4);
        --coral: #ff5c6c;
        --purple: #7657ff;
        --mint: #55d6be;
        --yellow: #ffc857;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--navy);
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-image:
          radial-gradient(
            40rem 26rem at 12% -10%,
            rgba(255, 92, 108, 0.18),
            transparent 62%
          ),
          radial-gradient(
            38rem 24rem at 92% 6%,
            rgba(118, 87, 255, 0.22),
            transparent 62%
          );
        background-repeat: no-repeat;
      }

      main {
        width: 100%;
        max-width: 36rem;
        text-align: center;
      }

      .mark {
        display: block;
        margin: 0 auto 28px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border: 1px solid rgba(255, 92, 108, 0.3);
        background: rgba(255, 92, 108, 0.1);
        color: var(--coral);
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 22px 0 0;
        font-size: clamp(2.1rem, 6.5vw, 3rem);
        line-height: 1.08;
        letter-spacing: -0.02em;
        font-weight: 800;
        text-wrap: balance;
      }

      .lede {
        margin: 18px auto 0;
        max-width: 32rem;
        color: var(--ink-soft);
        font-size: 1.08rem;
      }

      .pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 32px 0 0;
        padding: 0;
        list-style: none;
      }

      .pills li {
        padding: 8px 16px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        font-size: 0.9rem;
        color: var(--ink-soft);
      }

      .pills li b {
        font-weight: 600;
      }

      .c1 b {
        color: var(--coral);
      }
      .c2 b {
        color: var(--purple);
      }
      .c3 b {
        color: var(--mint);
      }
      .c4 b {
        color: var(--yellow);
      }

      footer {
        margin-top: 40px;
        color: var(--ink-faint);
        font-size: 0.85rem;
      }
    </style>
  </head>

  <body>
    <main>
      <!-- Geometry matches SHAPES in src/components/logo.tsx. -->
      <svg
        class="mark"
        width="60"
        height="60"
        viewBox="0 0 48 48"
        role="img"
        aria-label="Bunchy"
      >
        <rect
          x="4.8" y="6.2" width="21.4" height="21.4" rx="7.2"
          fill="#FF5C6C" transform="rotate(-7 15.5 16.9)"
        />
        <rect
          x="29" y="10.4" width="14.2" height="14.2" rx="4.8"
          fill="#7657FF" transform="rotate(13 36.1 17.5)"
        />
        <rect
          x="7.6" y="30.6" width="14.6" height="14.6" rx="4.9"
          fill="#55D6BE" transform="rotate(8 14.9 37.9)"
        />
        <rect
          x="26.4" y="28.4" width="16.2" height="16.2" rx="5.5"
          fill="#FFC857" transform="rotate(-10 34.5 36.5)"
        />
      </svg>

      <span class="badge">Coming soon</span>

      <h1>Bunchy is nearly ready.</h1>

      <p class="lede">
        A place to find people who are into the same things as you — and
        actually do something together. Online, nearby, or both.
      </p>

      <ul class="pills">
        <li class="c1"><b>Find your people</b></li>
        <li class="c2"><b>Make a plan</b></li>
        <li class="c3"><b>Online or in person</b></li>
        <li class="c4"><b>No feed, no followers</b></li>
      </ul>

      <footer>Bunchy — find your people.</footer>
    </main>
  </body>
</html>
